version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support123
      POSTGRES_DB: support_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://support:support123@postgres:5432/support_db
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api/src:/app/src
    command: sh -c "node /app/seed.js && npm run dev"

  frontend:
    build:
      context: ./frontend  # 👈 path to your React app
      dockerfile: Dockerfile
    ports:
      - "5173:80"          # frontend visible at http://localhost:5173
    depends_on:
      - api
    environment:
      - VITE_API_URL=http://localhost:3001  # 👈 optional, for frontend to call backend

volumes:
  postgres_data:
